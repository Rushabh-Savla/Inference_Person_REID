name: Developing ReID CI

on:
  push:
    branches:
      - developing
  pull_request:
    branches:
      - developing

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest pyyaml opencv-python-headless scipy
      - run: >
          python -m py_compile
          rebuild/nvdcf_tracker.py
          rebuild/multimodal_identity.py
          rebuild/batch_nvdcf.py
          rebuild/face_v4.py
          rebuild/person_attributes.py
          rebuild/multimodel_state_invariant_attributes.py
          rebuild/batch_state_invariant_overlap_reid.py
          rebuild/batch_state_authoritative.py
          rebuild/multimodel_state_invariant_final.py
          rebuild/multimodel_state_invariant_fast.py
          rebuild/batch_state_invariant_joint.py
          rebuild/run.py
          src/live/qdrant_gallery.py
      - run: >
          python -m pytest -q
          rebuild/test_state_invariant_reid.py
          rebuild/test_overlap_reid_recovery.py
          rebuild/test_nvdcf_contract.py
