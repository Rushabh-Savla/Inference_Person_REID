name: Final Multimodel ReID CI

on:
  push:
    branches:
      - final/multimodel-reid-production
  pull_request:
    branches:
      - final/multimodel-reid-production

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest pyyaml opencv-python-headless
      - run: python -m py_compile rebuild/multimodel_reid.py rebuild/batch_multimodel.py rebuild/preflight_final_multimodel.py src/reid/nvidia_reid.py src/reid/nvidia_swin.py src/reid/solider_reid.py
      - run: python -m pytest -q rebuild/test_identity_v6.py rebuild/test_multimodel_reid.py
