name: reid-v4-ci

on:
  push:
    branches:
      - feature/reid-v4
  pull_request:
    branches:
      - rebuild/clean-system

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless
      - name: Compile V4
        run: python -m py_compile rebuild/face_v4.py rebuild/identity_v4.py rebuild/batch_v4.py rebuild/live_v4.py rebuild/run.py rebuild/test_identity_v4.py
      - name: Identity unit test
        run: python -m rebuild.test_identity_v4
