name: reid-v6-ci

on:
  push:
    paths:
      - 'rebuild/identity_v6.py'
      - 'rebuild/test_identity_v6.py'
      - 'rebuild/identity_v3.py'
      - '.github/workflows/reid-v6-ci.yml'
  pull_request:
    paths:
      - 'rebuild/identity_v6.py'
      - 'rebuild/test_identity_v6.py'
      - 'rebuild/identity_v3.py'
      - '.github/workflows/reid-v6-ci.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy
      - name: Run V6 identity tests
        run: python -m rebuild.test_identity_v6
