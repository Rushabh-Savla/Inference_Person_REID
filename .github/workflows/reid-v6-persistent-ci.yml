name: reid-v6-persistent-ci

on:
  push:
    branches:
      - 'final/v6-persistent-reid'
    paths:
      - 'src/live/identity_engine.py'
      - 'src/live/persistent_identity.py'
      - 'src/live/identity_stage.py'
      - 'tests/live/test_persistent_identity_v6.py'
      - '.github/workflows/reid-v6-persistent-ci.yml'
  pull_request:
    paths:
      - 'src/live/identity_engine.py'
      - 'src/live/persistent_identity.py'
      - 'src/live/identity_stage.py'
      - 'tests/live/test_persistent_identity_v6.py'
      - '.github/workflows/reid-v6-persistent-ci.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install numpy
      - name: Compile live identity modules
        run: python -m py_compile src/live/identity_engine.py src/live/persistent_identity.py src/live/identity_stage.py tests/live/test_persistent_identity_v6.py
      - name: Run persistent lifecycle tests
        run: python -m pytest -q tests/live/test_persistent_identity_v6.py
