name: State Invariant Final ReID CI

on:
  push:
    branches:
      - final/multimodel-state-invariant
  pull_request:
    branches:
      - final/multimodel-state-invariant

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest pyyaml opencv-python-headless
      - run: python -m py_compile rebuild/multimodel_state_invariant.py rebuild/batch_state_invariant.py rebuild/run.py rebuild/test_state_invariant_reid.py src/live/persistent_multimodel.py src/reid/nvidia_reid.py src/reid/nvidia_swin.py src/reid/solider_reid.py
      - run: python -m pytest -q rebuild/test_state_invariant_reid.py rebuild/test_identity_v6.py rebuild/test_multimodel_persistence.py
