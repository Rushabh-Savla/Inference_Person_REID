    # ┌──────────────────────────────────────────────────────────────────────────┐
    # │ MEASURED IN FASTREID SPACE, 2026-08-04. THIS VALUE IS TOO STRICT.        │
    # │ Value NOT changed -- see "why not changed yet" at the bottom.            │
    # └──────────────────────────────────────────────────────────────────────────┘
    # First re-anchoring measurement since the backbone switch. Until 2026-08-04 it
    # could not be taken at all: measure_score_separation.py crashed on FastReID
    # (it reached into torchreid OSNet's `fc` block for its tap comparison), so
    # there was no way to derive a threshold for the model actually running. Fixed;
    # both scripts below now run on any backend.
    #
    #   python tests/calibration/measure_reconcile_thresholds.py register_file.avi 48 4
    #   python tests/calibration/measure_score_separation.py   register_file.avi 48 6
    #
    # A. SAME PERSON, prototype vs prototype (one track split into two DISJOINT
    #    halves -- exactly what a dropped-then-reacquired track looks like):
    #        0.75 -> 100.0% of fragments merge
    #        0.80 -> 100.0%
    #        0.85 ->  75.0%
    #        0.90 ->  50.0%   <-- THE CONFIGURED VALUE. Half are refused.
    #        0.95 ->  25.0%
    #
    # B. DIFFERENT PEOPLE, proven distinct by co-occurrence in one frame (needs no
    #    operator labels -- one body cannot be two simultaneous detections):
    #        n=6  mean=0.276  p95=0.427  MAX=0.434
    #        0% wrong merges at 0.63 AND at 0.90 -- strangers are nowhere near.
    #
    # C. THE WINDOW:
    #        same-person fragments  min=0.810  p5=0.821
    #        different people       MAX=0.434  p95=0.427
    #        any bar in (0.434, 0.810) is PERFECT on this sample.
    #        0.90 is OUTSIDE it, above the fragment distribution.
    #
    # Corroborated independently by measure_score_separation.py on the same clip:
    # the different-person ceiling is ~0.46-0.50 across all four scoring modes and
    # STABLE between 24 and 48 frames (prototype MAX 0.503 -> 0.477), while
    # same-person p5 is 0.594. The feature space itself confirms the old bars do not
    # belong here: 62.2% of dimensions NEGATIVE and 0% exactly zero, against OSNet
    # post-ReLU's 0% negative / 21% zero.
    #
    # WHICH VALUE THE EVIDENCE SUPPORTS: 0.80, not the window's midpoint. The two
    # failure modes are asymmetric -- too low fuses two people (unrecoverable), too
    # high splits one person (reconcile can still fix it) -- so per the "prefer a
    # split" bias, pick near the TOP of the window. 0.80 still merges 100% of
    # fragments and keeps +0.37 of headroom over the measured stranger MAX for when
    # the sample grows. Note cam_213 and cam_224 already override to exactly 0.80,
    # so this would only move cam_219 and cam_206.
    #
    # WHY NOT CHANGED YET: `MAX` grows with sample size and n=6 proven-distinct
    # pairs is small, so the window's LOWER edge is soft (its upper edge, from the
    # fragment distribution, is the one that bounds the bar and is the side that
    # matters). More importantly, a bar must be watched on video before it ships --
    # two settings previously chosen from numbers alone made the videos worse. Rank
    # first, then look:
    #   python tests/calibration/sweep_reconcile_thresholds.py <run_id> \
    #     --same "cam_219=0.90,cam_224=0.80 ; cam_219=0.80,cam_224=0.80"
    #   python tests/calibration/rerender_from_clips.py <run_id> --same "cam_219=0.80,cam_224=0.80"
    # Then move the value and this block TOGETHER.
    #
    # ALSO SUPERSEDED IF YOU DO: the note under per_camera below says cam_219 is
    # "deliberately LEFT at the global 0.90". That was written in OSNet space about a
    # July run, and lowering the global overrides it.

    # PER-CAMERA same-camera bars (REMEDIATION_PLAN.md #40). Only
    # `same_camera_threshold` is honoured here; any other key is IGNORED with a
    # warning (see reconcile.resolve_same_camera_thresholds), because `threshold` is
    # a property of a camera PAIR and the rest are whole-run settings. Camera names
    # are the runtime names -- stream URLs are auto-named cam_<last-IP-octet>, so
    # replacing a camera renames it and this block must follow. A name that produces
    # no tracklets is reported in the reconcile log rather than silently ignored.
    #
    # WHY THIS IS NOT ONE GLOBAL NUMBER. Measured on run 20260730_093723 (286
    # decisions, 4 cameras) with the analyser in tests/calibration: the per-subject
    # same/different boundaries OVERLAP across cameras -- p95 of the "top different"
    # score (0.816) is ABOVE p5 of the "worst same" score (0.719) -- so no single
    # bar separates cleanly. Eligible same-camera partners per subject at 0.90:
    #
    #     cam_206: 9.0 (55 subjects,  6 with none)   <- 0.90 works here
    #     cam_224: 0.5 (17 subjects, 12 with none)
    #     cam_219: 0.3 ( 6 subjects,  4 with none)
    #     cam_213: 0.0 (11 subjects, 11 with none)   <- ZERO merges, ever
    #
    # A camera with no same-camera merging cannot join one person's front-view and
    # back-view fragments, so each fragment is absorbed cross-camera into a
    # DIFFERENT cluster: that is the observed "reid 2 by his front, reid 7 by his
    # back" in cam_213 and "reid 3 becomes reid 7 at a bad angle" in cam_224.
    # 37% of all subjects had no eligible partner; the highest score the bar
    # rejected was 0.899.
    #
    # cam_219 is deliberately LEFT at the global 0.90 even though it also orphans
    # (4 of 6): it has only 7 tracklets, mean 264 observations each, so it has
    # little fragmentation to repair and changing it would confound this run's
    # comparison. Move it only after diffing this run against the previous one.
    #
    # These two values are a HYPOTHESIS from one run, not a calibration (decision
    # D9). Change ONE thing, re-run, and diff the analyser's sections 1/2/5:
    #   python tests/calibration/analyze_decision_log.py logs/reconcile_decisions_<run_id>.jsonl
    # MEASURED on run 20260730_111232 with
    # tests/calibration/sweep_reconcile_thresholds.py, which re-clusters a
    # finished run's stored observations offline -- so both values below were
    # chosen from real data, not from one live run each.
    # ===================== CHANGED 2026-08-05, AGAINST LABELS =====================
    # cam_219 0.90 -> 0.55 (it had NO override and inherited the global) and
    # cam_213 0.80 -> 0.55. This is the FIRST threshold change in this project chosen
    # against operator-confirmed pairs rather than against an identity count, which is
    # how all seven reverted changes were chosen. Tool:
    #   python tests/calibration/sweep_against_labels.py 20260804_064551
    #
    # It runs the REAL reconcile over the run's REAL stored vectors at every cell of a
    # 2-D bar grid and scores each cell on two things that are labelled or provable:
    #   * the 3 operator-confirmed same-person pairs (CLAUDE.md 3b) -- one cluster?
    #   * PROVABLE false merges: 28 pairs co-present in one camera for >0.5s, which
    #     are two people by construction -- did any land in one cluster?
    #
    #   cam_213 ->      0.90    0.80    0.70    0.60    0.55    0.50
    #   cam_219 0.90     1/3     1/3     2/3     2/3     2/3     2/3      <- SHIPPED
    #   cam_219 0.80     1/3     1/3     1/3     2/3     2/3     2/3
    #   cam_219 0.70     2/3     2/3     2/3     2/3     2/3     2/3
    #   cam_219 0.60     2/3     2/3     2/3     3/3     3/3     3/3
    #   cam_219 0.55     2/3     2/3     2/3     3/3     3/3     3/3      <- CHOSEN
    #   cam_219 0.50     2/3     2/3     2/3     3/3     3/3     3/3
    #
    # PROVABLE FALSE MERGES WERE **ZERO IN ALL 36 CELLS**, including 0.50/0.50. The
    # false-merge fear that has driven every conservative choice here does not
    # materialise on this run at any bar. Identities go 15 -> 8.
    #
    # WHY 0.55/0.55 AND NOT THE LOOSEST OR THE STRICTEST 3/3 CELL. It is the
    # strictest cell with all four neighbours also clean, so it survives a +/-0.05
    # step in either bar. 0.70/0.63 also reaches 3/3 but is ISOLATED -- a single clean
    # cell is fitted to three labels, a 3x3 plateau is not.
    #
    # WHAT IS NOT ESTABLISHED, and this is the honest limit:
    #   * n = 3 labelled pairs. A hypothesis with a plateau, not a calibration.
    #   * "zero provable false merges" is NECESSARY, NOT SUFFICIENT. Co-presence can
    #     only convict pairs that share a frame; two people who never co-occur can
    #     still be fused and this reference cannot see it.
    #   * 15 -> 8 identities is a big move and a COUNT CANNOT JUDGE IT (section 4).
    #   * IT HAS NOT BEEN WATCHED. Run 20260804_064551's clips were overwritten (see
    #     CLAUDE.md 7), so watch it on 20260804_120409, which still has footage:
    #       python tests/calibration/rerender_from_clips.py 20260804_120409 \
    #           --same "cam_219=0.55,cam_213=0.55"
    #     REVERT IS THESE TWO VALUES. If it over-merges on video, put cam_219 back to
    #     0.90 and cam_213 to 0.80 and record what you saw here.
    # ==============================================================================
    # Waives cross-camera reciprocal-best for pairs scoring at or above this.
    # 0.0 = OFF, the shipped behaviour: a pair must be each other's single best.
    #
    # WHY: with three similar people in one room, mutual-best deadlocks -- A's
    # best is X, X's best is B, so neither pair is mutual and both are refused.
    # Run 20260806_095141: 10 cross-camera merges refused at 0.677-0.773, only 2
    # accepted. Turning reciprocal-best fully OFF instead produced a false merge
    # (guy A's cam_224 tracklet absorbed into guy B's cluster). This is the
    # middle position.
    #
    # CHOOSING A VALUE. Above the run's provable-stranger p95, never below.
    # 20260806_095141 measured p95 0.627, max 0.779 -- so 0.70 waives the guard
    # only for pairs stronger than 95% of known strangers, while 0.60 would waive
    # it for pairs weaker than some of them.
    #     python tests/calibration/compare_backbones_on_run.py <run>   # prints p95
    #
    # WATCH THE VIDEO. This can only ADD merges, and a false merge fuses two
    # people's histories with no un-merge available (CLAUDE.md section 5).
    reciprocal_best_waiver: 0.0
    per_camera:
      cam_219:
        same_camera_threshold: 0.60
        # Had NO override until now, so it inherited the global 0.90. The note below
        # claiming it was "deliberately LEFT at 0.90" is SUPERSEDED: its stated
        # premise was "only 7 tracklets, mean 264 observations each, so little
        # fragmentation to repair", and on 20260804_064551 cam_219 has 15 tracklets
        # with ZERO of 23 eligible same-camera pairs clearing 0.90 -- measured on all
        # five surviving runs, 0 of 114. Its confirmed pair scores 0.574 and its
        # measured co-present stranger max is 0.458, so the window is (0.458, 0.574].
        # The LIVE path already moved for the same reason and sits at 0.70
        # (live.identity.same_camera_threshold, lowered twice off "29/42 same-camera
        # reacquisitions failed JUST under 0.90, max 0.898"); offline was the last
        # holdout at 0.90 and nothing recorded the divergence.
      cam_213:
        same_camera_threshold: 0.60
        # WAS 0.80, whose note read: "KEPT at 0.80. The operator's front/back
        # complaint in this camera is tracklets 46+51, which merge at 0.815 -- at
        # 0.85 they split again and the symptom returns. None of the three confirmed
        # false merges (reid 5, 6, 10) involved a cam_213 same-camera merge."
        # That is still true and 0.55 does not contradict it -- 0.815 clears 0.55 too.
        # What 0.80 could NOT do is merge cam_213's own confirmed pair 31+35 at
        # 0.630, which no cell at 0.70 or above reaches. cam_213 also has FEWER THAN 3
        # co-present pairs in every run, so it has no stranger reference at all and
        # its bar cannot be bounded from below by measurement -- the label is the only
        # evidence there is, which is a reason to watch this camera first
        
      cam_224:
        same_camera_threshold: 0.60
      # REVERTED to 0.80 on 2026-07-30, after the operator watched the videos.
      #
      # The reasoning for raising it to 0.90 is below and still reads well; the
      # OUTPUT got worse anyway. Raising it split one person into many numbers,
      # which the operator rated worse than the false merges it removed. Both
      # states are wrong -- that is #45a -- but this is the one that was rated
      # less wrong on screen, so this is where the config sits until a change is
      # validated on a re-rendered video BEFORE it ships.
      #
      # Superseded reasoning, kept because the measurements were real:
      #
      # It caused two of the three false merges the operator saw:
      #   reid 6  <- cam_224 58+112 @ 0.823 and 58+120 @ 0.872
      #   reid 5  <- cam_224 26+110 @ 0.845
      # Raising it back to the global 0.90 removes exactly those tracklets and
      # nothing else; 0.87 is NOT enough (it keeps 120 via the 0.872 merge).
      #
      # Why the J.6 evidence for 0.80 stopped applying: it was measured when
      # cam_224 and cam_213 were fed by yolo11n. With yolo11m, cam_213 went from
      # 85 observations to 1400 (mean 7.7 -> 28.6 per tracklet). Prototypes built
      # from ~7 crops are noisy, which is WHY nothing cleared 0.90 back then. The
      # detector change fixed the cause; the lowered bar then became pure risk.
      # Tightening it also RAISED identities spanning >1 camera (9 -> 12), because
      # over-merged same-camera clusters had been swallowing tracklets that should
      # have formed their own cross-camera identity.
      #
      # Do not re-add cam_224 here without re-running the sweep -- and if the
      # detector changes again, re-derive BOTH cameras.

    # HOW TWO TRACKLETS ARE COMPARED (REMEDIATION_PLAN.md #45a).
    #   prototype     -- cosine of the two MEANS. What has always shipped.
    #   max_exemplar  -- max(prototype, best single observation pair). What the
    #                    live engine uses, documented there as "more robust than a
    #                    mean alone when a person flips front/back".
    #   consensus     -- mean of the top `consensus_top_frac` of all observation
    #                    pairs. Needs MANY matching views, not one.
    #
    # WHY THIS EXISTS. A mean is the wrong summary for a person who changes
    # appearance mode. Someone seen front-on and then from behind has two clusters
    # of observations and their mean sits between them, matching NEITHER view -- so
    # their own two fragments score LOW, while two different people in similar
    # clothing, whose means both sit in the "average person" region, score HIGH.
    # That is why J.6 found the per-subject boundaries OVERLAPPING and why no
    # threshold worked from either direction: 0.80 in cam_224 fused strangers into
    # one reid, 0.90 shattered one person into many.
    #
    # Measured on the synthetic front/back counterexample
    # (tests/live/test_reconcile_scoring_modes.py, 23 checks):
    #   prototype    one person's two visits 0.640, BELOW two strangers at 0.800
    #   max_exemplar same person 1.000, strangers 0.800  -- ordering fixed, BUT one
    #                bad crop in ten fuses two people (1.000)
    #   consensus    same person 1.000, strangers 0.800, and the same bad crop
    #                scores only 0.880 -- fixes the split WITHOUT that hole
    # Part H agrees independently: consensus had the lowest different-person
    # ceiling of the three modes at both sample sizes.
    #
    # TRIED `consensus` ON 2026-08-04 AND REVERTED THE SAME DAY. It ran for exactly
    # one run, 20260804_064551, and made the reported defect WORSE. This is the sixth
    # tuning change to be reverted for hurting accuracy (CLAUDE.md section 3).
    #
    # THE MEASUREMENT THAT REVERTED IT --
    # explain_merge_failure.py 20260804_064551 1 2, per shared camera, one person's
    # own two fragments scored against that camera's bar:
    #
    #   camera    fragment pair            prototype   max_exemplar   consensus   bar
    #   cam_213   0031 vs 0035             0.630 fail   0.663 fail    0.567 fail  0.80
    #   cam_219   0020 vs 0008             0.574 fail   0.600 fail    0.468 fail  0.90
    #   cam_224   0001 vs 0030             0.907 PASS   0.907 PASS    0.582 fail  0.80
    #
    # Consensus LOWERED all three, and cam_224's pair crossed from PASS to FAIL --
    # which is exactly the operator's "cam_224 went reid 1, then reid 2, then back to
    # reid 1". Under prototype those two fragments merge in Phase 1 and that
    # flip-flop does not happen. max_exemplar is weakly the best of the three on
    # every row, and is what the live engine already uses -- the obvious next
    # candidate, but it must be watched on video before it ships, not reasoned about.
    #
    # WHY THE SWEEP DID NOT CATCH THIS: sweep_reconcile_thresholds.py reports
    # cluster SHAPE (ids, max, multi). Consensus looked better there -- max cluster 3
    # instead of 7 -- and that reading was wrong, because no headcount existed to say
    # whether 7 was a weld or a correctly-followed person. It was a person. Judge a
    # mode on the FRAGMENT-PAIR table above, which explain_merge_failure.py prints,
    # not on cluster counts.
    #
    # ORIGINAL REASONING FOR THE CHANGE, kept because the front/back argument still
    # stands and only the remedy was wrong:
    #
    # THE SYMPTOM IT FIXES, reported by the operator: one person carried a DIFFERENT
    # reid in cam_219 than in cam_224, front angle vs back angle, and offline
    # reconcile did not repair it. That is this block's opening paragraph happening
    # in production -- and cam_219 + cam_224 SHARE A ROOM, so they see opposite sides
    # of the same person AT THE SAME INSTANT. A mean over front and back views is
    # then the worst possible summary, systematically, not occasionally.
    #
    # MEASURED on run 20260803_131521 (3 cameras, 1753 observations) with
    # sweep_reconcile_thresholds.py --scoring prototype,consensus. The sweep reads
    # consensus_top_frac from this file, so its consensus rows ARE this estimator:
    #
    #   prototype, cross 0.50..0.80 : max cluster stays 7 at EVERY bar
    #   consensus, cross 0.40..0.80 : max cluster is 3 at EVERY bar
    #
    # Under prototype, cam_224's tracklets 1/48/79/103 were welded together
    # same-camera and no cross-camera bar could separate them -- exactly the "a
    # cluster welded inside a camera cannot be split by any cross bar" case. That
    # weld is why cam_219 had nothing to link to. Under consensus the weld does not
    # form at any bar, and each cam_219 tracklet pairs with ONE cam_224 tracklet:
    #   219(49)->224(48)  219(10)->224(79)  219(11)->224(5)   219(12)->224(3)
    #   219(85)->224(77)  219(112)->224(103) 219(116)->224(1)
    # Four of those pairings (112/103, 116/1, 12/3, 10/79) prototype never made at
    # ANY threshold.
    #
    # NOT EVIDENCE, deliberately: the identity COUNT. People walk in and out of this
    # room, so no run has a count to hit, and CLAUDE.md section 4 is the standing
    # reminder that a count cannot tell one person from three.
    #
    # STILL UNVERIFIED, and the reason to watch the next run's video: whether the
    # clusters above are correct, and consensus's own different-person ceiling, which
    # has never been measured in FastReID space. Re-derive the same-camera bars too --
    # consensus also re-pairs cam_213 (88+93 under prototype, 88+119 here).
    # PHASE 2's same-camera bar, separate from PHASE 1's above. null = use Phase 1's
    # value, which is byte-identical to everything shipped so far.
    #
    # WHY THE TWO WERE EVER ONE NUMBER, AND WHY THAT IS THE BUG. Both phases can
    # assert "these same-camera pieces are one person", but on very different
    # evidence: Phase 1 compares two SINGLE tracklets, Phase 2 compares two CLUSTERS
    # that are each already assembled from several tracklets, denoised over far more
    # observations, and already past their own Phase-1 and reciprocal-best checks. A
    # cluster-level agreement at cosine X is stronger evidence than a tracklet-pair
    # agreement at the same X, so holding both to one number over-constrains Phase 2.
    #
    # MEASURED, run 20260804_064551 (the operator's reported split):
    #   the person's two clusters each span cam_213 + cam_219 + cam_224, so
    #   strictest_same_camera_bar picks cam_219's 0.90 -- and they score 0.840.
    #   The join fails by 0.060.
    #   Lowering cam_219 to 0.80 DOES open it, but the same lowering simultaneously
    #   admits three unverified PHASE 1 pairs in cam_219 (16+39 0.897, 42+49 0.866,
    #   8+38 0.855 -- the last is the wrong capture the per_camera note warns about).
    #   Re-rendered and confirmed: exactly those three Phase-1 merges, no cluster
    #   join, 15 -> 12 identities. One number cannot serve both phases.
    #
    # Capped at each camera's Phase-1 bar, so this can only ever RELAX Phase 2, never
    # tighten it -- a claim with more evidence must not face a stricter standard.
    #
    # DIRECTION OF RISK, stated plainly: this LOWERS a bar, and a false merge fuses
    # two people's histories, which is the unrecoverable error (CLAUDE.md section 5).
    # That is why it ships null. What bounds the risk is that Phase 2 still requires
    # reciprocal-best between clusters and still applies every HARD physical veto
    # (same-camera time overlap, cross-camera co-presence, geometric reachability),
    # none of which any appearance score can override.
    #
    # TO ADOPT IT: sweep, then WATCH, then move this value and this comment together.
    #   python tests/calibration/sweep_reconcile_thresholds.py <run_id>
    #   python tests/calibration/rerender_from_clips.py <run_id>   # prints every merge
    # Judge it on whether the operator's person carries ONE id across cameras, never
    # on the identity count (section 4). Regression-pinned by
    # tests/live/test_reconcile_cluster_bar.py (11 checks, incl. that null is a no-op).
    cluster_same_camera_threshold: null

    # ============ MEASURED 2026-08-05: max_exemplar is the better mode ============
    # NOT YET ADOPTED, deliberately -- the mode and the bar must move together (a mode
    # change voids every threshold, see below), and bundling two changes is what sank
    # the tracker attempt. Adopt it AFTER a capture with real labels.
    #
    # Scored on run 20260804_064551 against the 3 operator-confirmed pairs plus 28
    # PROVABLE strangers (co-present in one camera >0.5s), via
    #   python tests/calibration/sweep_against_labels.py 20260804_064551
    # Best setting reaching ALL 3 labels with ZERO provable false merges:
    #
    #     mode           bar    identities   time     note
    #     prototype      0.55            8   0.13s    what ships now
    #     max_exemplar   0.65            7   0.22s    +0.10 MORE MARGIN
    #     consensus       --            --     --     never reaches 3/3 (best 2/3)
    #     view_medoid     0.65           8   2.65s    12x slower, no gain over max_ex
    #
    # max_exemplar reaches the same 3/3 at a bar 0.10 HIGHER, i.e. with more headroom,
    # for ~0.1s. It independently corroborates AGENT_BRIEF, which already measured it
    # as the only mode with a positive margin in EVERY camera (+0.075 cam_219,
    # +0.212 cam_224, +0.280 cam_213). Two separate lines of evidence agree.
    #
    # ITS KNOWN RISK, unchanged: max over observation pairs means ONE bad crop can
    # match a stranger at ~1.0. The sweep found zero provable false merges at every
    # bar down to 0.50 -- but 28 co-present pairs is a weak net for exactly that
    # failure, because it can only convict people who share a frame.
    #
    # AND A CLEAN NEGATIVE WORTH NOT REPEATING: raising max_observations_per_side from
    # 64 to 0 (ALL observations) changes the label and false-merge results NOT AT ALL,
    # in every mode. Median observations per tracklet on that run is 8, so the cap of
    # 64 was never binding. "Compare more embeddings" is already happening; what limits
    # accuracy is the POOLING FUNCTION (a mean throws view information away), not the
    # sample size. Do not spend time raising the cap.
    # ==============================================================================
    scoring: prototype
    consensus_top_frac: 0.25   # what FRACTION of observation pairs must agree.
                               # Part H's "top half" was measured on whole tracks,
                               # where most view pairs match; between a mostly-front
                               # fragment and a mostly-back one only a minority do
                               # (32 of 100 in the fixture), so 0.5 averages in
                               # mismatched pairs and buries the signal at 0.727.
                               # Lower = closer to max_exemplar and its weakness.
    max_observations_per_side: 64   # cap per tracklet/cluster for the pairwise
                                    # product; evenly spaced, never random, so a
                                    # replay reproduces the score exactly. 0 = no cap.

    # RECIPROCAL BEST in the SAME-CAMERA phase (plan item, operator's priority 3).
    # Phase 2 has always required two clusters to be each other's best partner;
    # Phase 1 never did, so it merged EVERY above-bar pair in score order. That is
    # how one weak edge pulls a stranger in: in run 20260730_111232, cam_224's
    # tracklet 58 had its best partner at 0.937 (16) and yet ALSO merged with 112
    # at 0.823 and 120 at 0.872, fusing two people into one reid. Mutual-best
    # refuses both without moving any threshold -- it removes the over-merge /
    # under-merge trade instead of repositioning it.
    #
    # COST: someone fragmented into 3+ pieces gets only one mutual-best pair per
    # round in Phase 1; the rest consolidate in Phase 2's rounds instead, so they
    # arrive later rather than never.
    #
    # Test with NO other change, on a captured run, and watch the video:
    #   python tests/calibration/rerender_from_clips.py <id> --same-reciprocal
    # That flag was DOCUMENTED HERE BUT NEVER PARSED until 2026-07-31, so the test
    # this line describes silently measured no change at all. It works now, and the
    # re-render also inherits this key from config, so the default already matches
    # production and the flag is only needed to force it on. See Part M.7 item M-c.
    same_camera_reciprocal_best: true

    # ITERATE PHASE 1 (REMEDIATION_PLAN.md M.9.11). OFF = one pass, which is what
    # has always shipped.
    #
    # Phase 1's own comment used to claim that a person fragmented into 3+ pieces
    # would be consolidated later by Phase 2's rounds. That is false: Phase 2's
    # `mergeable_cross` requires a CROSS-camera member pair, so two clusters that
    # both sit in one camera are excluded outright and the promised consolidation
    # never happens.
    #
    # Measured on run 20260731_060425, cam_206, ONE person in three fragments:
    #     206/26 <-> 206/43 = 0.916  merged (each other's best)
    #     206/12 <-> 206/43 = 0.906  ABOVE the 0.90 bar, REFUSED
    # 12's best partner is 43; 43's best is 26. Mutual-best rejected an edge that
    # cleared the bar by 0.006, 12 was orphaned, and it was then captured
    # cross-camera at 0.771 into a DIFFERENT person's identity -- the operator's
    # "it misidentified someone in cam_206 as reid 1, then a few seconds later they
    # get reid 6". No bar fixes this: the edge is already above the bar, and
    # lowering cam_206 to 0.85/0.80 leaves 206/12 exactly where it was while fusing
    # cam_206's crowd (25 -> 21 -> 20 identities).
    #
    # ON lets a fragment compete against the CLUSTER its sibling formed instead of
    # losing once and never being reconsidered. It relaxes nothing: every merge
    # still clears that camera's bar and still has to be a mutual best. Round 1 is
    # identical to the single pass by construction, so OFF is exactly the old
    # behaviour.
    #
    # Test it alone, on a captured run, and watch cam_206 at 0-7s:
    #   python tests/calibration/sweep_reconcile_thresholds.py <id> --same-rounds
    #   python tests/calibration/rerender_from_clips.py <id> --same-rounds
    same_camera_rounds: true
# MUTUAL-EXCLUSION AMBIGUITY MARGIN (Phase 2 only). 0.0 = OFF, which is what
    # has always shipped.
    #
    # Refuses a cluster's merge when its top TWO eligible candidates are PROVABLY
    # different people -- they carry a hard temporal conflict with each other --
    # and their scores differ by less than this. At most one of them can be the
    # right answer, so a small gap makes the pick a coin flip.
    #
    # MEASURED, run 20260805_115845, operator-confirmed. {cam_219:33, cam_219:39}
    # chose {cam_224:31,45,55} at 0.700 over {cam_224:32} at 0.654 -- and
    # cam_224:32 was the right person. The two candidates are co-present in
    # cam_224 for 4.1s over 13 instants, so they are provably two people.
    #
    # THE GAP IS SMALLER THAN THE BIAS IT LOST TO. Cluster prototypes are means of
    # means, so they denoise with member count: cam_224:32 scores 0.596 / 0.595 /
    # 0.552 against the winner's three members individually but 0.666 against
    # their mean. A 47-observation cluster beat an 11-observation singleton on
    # evidence volume, not on similarity.
    #
    # AND THE WRONG PICK CANNOT BE UNDONE. Once cam_224:31 was in, cam_224:32 was
    # co-present with a member and vetoed in every later round. The operator saw
    # this as "reid 11 in cam_224 was reid 4 in cam_213 and reid 9 in cam_219".
    #
    # WHY NOT top2_margin INSTEAD: analyze_decision_log section 3 measured 86.7%
    # of same-camera near-ties as one person's own fragments, where a blanket
    # margin gate REJECTS CORRECT MERGES. This gate requires the runner-up to be
    # a provably different person, so it cannot fire on fragmentation.
    #
    # PREDICTED EFFECT on 20260805_115845, checked against the decision log
    # before this was written: exactly ONE merge disappears, the wrong one
    # (219:33 + 224:31 @ 0.700). Every other accepted merge has a runner-up gap
    # of 0.125 or more, or only one eligible candidate. If anything else changes,
    # this patch is wrong -- revert to 0.0.
    #
    # STILL REQUIRED: watch it.
    #   python tests/calibration/rerender_from_clips.py 20260805_115845
    exclusive_ambiguity_margin: 0.05
    # CROSS-CAMERA SIMULTANEITY VETO (#38, Phase 7). conflict() used to skip every
    # cross-camera pair, so two tracklets overlapping IN TIME in cameras that
    # cannot both see one person still merged on appearance alone. A person in
    # cam_213 and a different person in cam_219 at the same moment is a physical
    # impossibility no cosine can excuse -- and it is a leading candidate for the
    # "one number on two people" symptom, which no threshold addresses.
    #
    # Needs wall-clock `ts`, which reconcile now reads (#26); frame indices are
    # per-camera and not comparable at 15 vs 25 fps.
    #
    # `covisible` = never vetoed. A number = veto when the two tracklets overlap by
    # MORE than that many seconds. A pair NOT listed is unconstrained (decision D1:
    # silence loses protection rather than splitting a real person), and startup
    # names every unlisted pair so that is visible instead of silent.
    #
    # Tolerances are generous on purpose: `ts` is RECEIVE time, not capture time
    # (#15), so it carries network jitter, decode-cost differences and frame-rate
    # quantisation. 1.0s vetoes only sustained overlap, not timing noise.
    #
    # OFF by default -- it has never run on real footage. Turn on ALONE.
    # ANCHOR CAMERA. null = OFF, which is what has always shipped.
    #
    # anchor_camera alone changes only Phase 2's MERGE ORDER: pairs touching the
    # anchor are merged first, while the other side is still a singleton and
    # therefore faces the cross-camera threshold rather than the stricter
    # strictest_same_camera_bar it would face after 219<->224 had already merged.
    # Everyone still gets an identity. Reversible, no new state.
    anchor_cameras: [cam_213]        # e.g. cam_213

    # require_anchor turns it into an ENROLMENT rule: a cluster with no anchor
    # member is UNREGISTERED -- global_id cleared, renders as UNRESOLVED.
    #
    # ON RUN 20260806_073648 THIS WOULD UNREGISTER 10 OF 13 IDENTITIES. Only
    # GID 3, 4 and 5 contained a cam_213 member. Everyone who never crossed
    # cam_213, and every cam_219/cam_224 tracklet that failed to LINK to one,
    # loses their identity.
    #
    # TWO THINGS TO VERIFY ON VIDEO BEFORE ENABLING:
    #   1. Can anyone reach the cam_219/cam_224 room without passing cam_213?
    #      live.topology calls it "the only way in/out" but that has never been
    #      checked. If it is wrong, those people are permanently unregistered.
    #   2. cam_213 is the weakest camera in the system -- 14.9 observations per
    #      tracklet on that run, 11 suppressed, 2 of 464 cross-camera pairs
    #      merged. A failed cam_213 link now costs a person their identity
    #      rather than costing them one link.
    require_anchor: false
    covisibility:
      enabled: true
      default_tolerance_sec: 1.0
      pairs:
        - [cam_224, cam_219, covisible]   # same room, overlapping views
        - [cam_213, cam_219, 1.0]
        - [cam_213, cam_224, 1.0]
        - [cam_213, cam_206, 1.0]
        - [cam_206, cam_219, 1.0]
        - [cam_206, cam_224, 1.0]

    min_tracklet_observations: 3  # a real identity needs >= this many observations;
                                   # shorter tracks are detector noise, not people
    require_reciprocal_best: false     # merge a pair only if they are each other's best
                                       # match -- stops look-alike over-merging on
                                       # weak/out-of-domain models. See reconcile.py.

    # ---- Phase 1 instrumentation (REMEDIATION_PLAN.md) ----------------------
    # Records EVERY merge decision -- accepted and rejected alike -- with all six
    # gates evaluated independently (no short-circuiting) and the full annotated
    # candidate vector. Purely diagnostic: it changes no decision, which
    # tests/live/test_phase1_decision_log.py asserts by comparing the reconciled
    # result with and without a log attached.
    #
    # Before this existed reconcile emitted four log lines, all of them successes,
    # so "why did this merge NOT happen" was unanswerable -- which is why four
    # rounds of threshold tuning were reverted without learning anything.
    #
    # <run_id> is substituted with the run timestamp. Blank/null disables logging.
    decision_log: logs/reconcile_decisions_<run_id>.jsonl

    top2_margin:
      # Runner-up margin: "is there a UNIQUELY plausible match", which is a
      # different question from the absolute threshold's "is there a plausible
      # match". Reconcile has never had this rule (reciprocal-best fills the role),
      # so it ships INERT and is enabled only once the logged distribution shows it
      # rejects something reciprocal-best does not. See REMEDIATION_PLAN.md Phase 9.
      threshold: null        # null = computed and logged, ENFORCES NOTHING
      # Which variant would gate if a threshold were set. Exactly one can ever
      # gate -- there is no way to express "both" -- because gating on two margins
      # at once makes the system much harder to reason about and tune.
      #   eligible    -- runner-up over candidates that survived the
      #                  ranking-independent hard constraints (selection safety:
      #                  a candidate that can never be picked should not suppress
      #                  a good merge)
      #   all_scored  -- runner-up over everything above the floor (evidence
      #                  quality: a near-tie means the embedding cannot separate
      #                  the two, whether or not the runner-up is available)
      # Both are ALWAYS logged regardless; this only picks the one that could gate.
      basis: eligible

# =============================================================================
# GEOMETRY (src/geometry/) -- where people are standing, used ONLY to rule out
# the physically impossible. Not a tracker: nothing here does 3D tracking, and
# nothing here can create or merge an identity. It can only refuse a merge.
#
# THE ONE RULE EVERYTHING ELSE FOLLOWS FROM:
#   The LIVE RUN records geometry. OFFLINE RECONCILE only CONSUMES it.
# Each observation's floor position is computed once, at capture, and stored in
# its Qdrant payload. Reconcile reads that; it never loads a calibration, applies
# a homography, or re-derives a position. So one run has ONE geometry, decided
# once, and re-reconciling it next year gives the same answer. Asserted by
# tests/live/test_geometry_not_recomputed.py. Full rationale: ADR-003D.
#
# UNITS ARE **FLOOR UNITS**, NOT METRES. The floor frame is fitted from camera
# imagery alone, which fixes the plane only up to an arbitrary scale. Nothing here
# claims metres and no metre-based threshold appears below -- the speed ceiling is
# measured from this deployment's own footage in the same unit as the distances,
# so the unknown scale cancels exactly. Metres become available only when a trusted
# metric reference is recorded in the calibration (verified floor plan / CAD,
# verified architectural dimension, or an independently measured reference
# distance), and they are needed only to relate SEPARATE floor groups.
#
# WHICH CAMERAS THIS CAN COVER. A floor frame needs cameras whose views overlap,
# because the frame is fitted from people's own foot points seen from both. Here
# that is cam_219 + cam_224 (same room). cam_206 and cam_213 overlap nothing, so
# NO geometry is derivable for them from imagery -- they stay appearance-only until
# real-world distances between the camera regions are supplied. That is a fact
# about the camera placement, not a gap in the code.
#
# FILE-BATCH MODE HAS NO GEOMETRY. The batch path's IdentityService._commit stores
# neither bbox nor ts, so there is nothing to position. To run geometry over
# RECORDED footage, use `--mode live` on the files: the live pipeline records bbox,
# ts and floor position exactly as it does for RTSP.
geometry:
  # Master switch for RECORDING. false = today's behaviour exactly: no positions
  # written, and every consumer treats their absence as "no opinion".
  #
  # Ships OFF because there is no calibration record yet. Fit one first (needs no
  # camera time and no measuring -- it uses a finished run's stored observations):
  #   python tools/fit_floor_frame.py <run_id>
  # then set this true for the next capture.
  #
  # RECORDING IS NOT RECOVERABLE AFTER THE FACT. The live RTSP feed is never
  # recorded, so a position not written during the run is gone. Leave recording on
  # once a calibration exists, even while the veto below is off.
  enabled: false

  calibration_path: calibration/floor_frame.json
  # <run_id> is substituted with the run timestamp. This sidecar is ANALYSIS input,
  # never a reconcile input -- it carries the image-space foot point, so a better
  # calibration can be applied offline without re-running detection.
  log_path: logs/geometry_<run_id>.jsonl

  # The reachability veto, consumed by OFFLINE RECONCILE.
  reconcile:
    # Gated separately from recording on purpose: recording is additive and safe,
    # while this changes identities. Turn it on ALONE, on a captured run, and watch
    # the video -- a cluster count cannot tell you whether a cluster is one person
    # or three (see REMEDIATION_PLAN.md Part A):
    #   python tests/calibration/sweep_reconcile_thresholds.py <run_id> --geometry
    #   python tests/calibration/rerender_from_clips.py <run_id> --geometry
    enabled: false

    # Cross-camera timestamp uncertainty, seconds. `ts` is when a frame was DECODED
    # locally, not when photons hit the sensor, so two cameras' stamps for one
    # instant differ by their encoder + network + decoder buffering. ADDED to every
    # elapsed time, so over-stating it only ever makes the veto MORE permissive.
    # 0.5 is ADR-003A's ceiling rather than its 150 ms target, deliberately.
    clock_error_sec: 0.5

    # Multiplies the MEASURED speed ceiling to get the veto line. The ceiling comes
    # from p99.9 of observed same-track speeds in the run being reconciled -- one
    # ByteTrack track is provably one person, so that distribution is this floor's
    # real answer and needs no metric scale. 1.5 leaves room for someone moving
    # faster than anything in that run (a run, a stumble).
    #
    # THIS IS THE ONLY TUNABLE HERE, AND IT SHOULD BE RAISED, NEVER LOWERED, WHEN IN
    # DOUBT. A wrong veto is unrecoverable: reconcile cannot un-split a person whose
    # merge it refused, which is precisely how the old live.topology min-transit
    # veto destroyed a run (links 5 -> 1, topology_pruned=508). A MISSED veto costs
    # nothing new -- it leaves a false merge that already happens today.
    safety_factor: 1.5

display:
  show_window: false         # true = OpenCV windows; false = headless. Only the
                             # file-batch flow uses this; the live pipeline is
                             # headless (its deliverable is output_<cam>.mp4).
  save_annotated: true       # write output_<name>.mp4 with boxes + ids
  window_scale: 1.0
  output_fps: 20.0           # fps for the saved/annotated output videos. Not read
                             # from the source (a file run uses this regardless of
                             # the source's real fps).

# =============================================================================
# REAL-TIME LIVE PIPELINE (src/live/). Handles STREAM sources (and files under
# --mode live): per-camera capture -> scheduler -> inference -> identity ->
# render -> writer, all threaded and load-shedding for real time. On stop it
# runs the offline reconcile (live.reconcile) to settle correct cross-camera ids
# and re-render output_<cam>.mp4. SEPARATE from the file-batch flow above; when
# the file-batch path runs (batch mode, or auto with file inputs) nothing here
# executes.
# =============================================================================
live:
  run:
    mode: auto              # live (always the live pipeline) | auto (live if any
                            # source is a stream URL, else file-batch) | batch
                            # (file-batch; stream URLs are rejected)
    device: auto            # auto (GPU if available else CPU) | cuda:0 | cpu
    max_duration_sec: 0     # 0 = until stopped (q / Ctrl-C)
  capture:
    nvdec: auto             # auto | on | off. NVDEC decode is a SERVER task; CPU
                            # decode is used until a GPU decode lib is available.
    reconnect_attempts: 5
    reconnect_base_delay: 1
    reconnect_max_delay: 30
    max_frame_staleness_ms: 100   # scheduler skips frames older than this
    # #48: when > 0 this WINS, expressing staleness in each camera's own FRAME
    # PERIODS instead of one absolute bound. 100ms is 2.5 frame periods at 25 fps
    # but only 1.5 at 15 fps -- the same number is a different rule per camera, and
    # it is strictest on the camera with the fewest frames to spare, which is
    # backwards. 2.5 periods keeps today's behaviour for the 25 fps cameras and
    # gives cam_224 the same relative allowance. 0 = absolute bound only.
    max_frame_staleness_periods: 2.5

    # ---- MEDIA TIME for RECORDED sources (src/live/frame.py, "two clocks") ----
    # A live camera's `ts` is stamped at frame read, which is milliseconds after the
    # event -- so it doubles as "when did this happen", and all four cameras share
    # one machine clock, which is what makes cross-camera timing comparable.
    #
    # A RECORDED FILE breaks that. Frames decode as fast as the disk allows (125+ fps
    # measured), so read time tracks decode progress, not events. Feed two files to
    # `--mode live` and the difference between their timestamps reflects THREAD
    # SCHEDULING. Every cross-camera temporal rule -- the co-presence veto, and all
    # of geometry's co-temporal pairing -- would then be built on invented
    # simultaneity that looks completely plausible.
    #
    # So for a file source the capture stage also stamps MEDIA time,
    # `offset + frame_index / fps`, and everything that asks "when did this happen"
    # uses that instead (Frame.event_ts(), the stored payload's `ts`, geometry). The
    # pipeline's own machinery -- scheduler freshness, writer pacing, the live
    # engine's TTLs -- deliberately stays on the wall clock.
    #
    # `file_time_offsets` shifts one camera's media timeline, in seconds, to line up
    # files that were not started at the same instant. Leave EMPTY when every
    # recording was started together: 0 then means "all files begin at t=0", which is
    # the truth. A positive value means this camera's recording started LATER than
    # the others by that much.
    #
    # Verify rather than assume: after a run, the fit's held-out reprojection error
    # is the check. A wrong offset shows up as a large residual that no calibration
    # can reduce, because you are pairing one person's feet with where they were a
    # second earlier.
    file_time_offsets: {}
    #   cam_224: 1.35     # this file started 1.35 s after the others
  inference:
    max_batch_size: 8       # forced to 1 on CPU (device-aware)
    t_batch_ms: 40          # dispatch a batch at max_batch_size OR this timeout.
                            # Raised 15->40 for Stage 2: a ~40ms window gathers a
                            # frame from EACH camera into one batch so they can be
                            # processed CONCURRENTLY (one worker per camera). Still
                            # well under one frame period; adds negligible latency.
    max_inference_queue: 4
                            # #51: was 2. On a CPU-with-file run the queue was where
                            # 629 of 637 dropped batches died -- but J.1 measured the
                            # REAL rate on production hardware at 10 frames in 40s,
                            # so this was never the production bottleneck it looked
                            # like. Raised modestly rather than deepened: each slot
                            # holds a full batch of frames at ~6 MB each, and an
                            # observed peak depth of 900 would have been ~5.6 GB of
                            # RAM. 4 absorbs a brief inference stall without letting
                            # latency grow, which is the whole point of dropping.
                            # NOTE: `max_skip_cycles` used to sit here, documented as a
                            # "scheduler starvation bound". NOTHING in the code ever read
                            # it -- BatchScheduler has no rotation state. Removed rather
                            # than implemented, because the scheduler is already fair by
                            # construction (measured 33.3/33.3/33.4% across 3 cameras at
                            # max_batch_size=1): slot.get() CLEARS the slot, so a
                            # just-served camera is empty on the next pass and the next
                            # camera wins. A redundant bound would add state for nothing.
    max_workers: 0          # Stage 2 inference parallelism. 0 = one worker per camera
                            # (recommended). Each worker owns a camera's detector +
                            # ByteTrack; the shared ReID extractor is lock-serialised.
    pose_ensemble: false    # LIVE ONLY. false = skip the 2nd (pose) detection model
                            # per frame -> ~2x detection throughput -> far fewer dropped
                            # frames -> stabler ByteTrack -> less identity fragmentation.
                            # The pose model only splits merged 2-people boxes; the
                            # throughput win matters more while inference is the choke.
                            # Batch path is unaffected (it reads detector.pose_ensemble).
                            # Re-enable once Stage 2 batched inference restores headroom.
  identity:
    max_queue: 64           # bound of the identity input queue AND of each
                            # per-camera lane in the anti-starvation fair buffer
    assign_latency_budget_ms: 5
    min_evidence_obs: 3     # evidence gate before ASSIGNED (never assign on 1st obs)
    same_camera_threshold: 0.70   # same-camera lane: cold reactivation of a dropped
                                  # then re-acquired track. Lowered 0.90 -> 0.85 from
                                  # A100 run #4: 29/42 same-camera reacquisitions failed
                                  # JUST under 0.90 (max 0.898) -> the person minted a new
                                  # id instead of reclaiming theirs = fragmentation, which
                                  # also crowds cross-camera matching. Co-present false
                                  # merges are separately blocked by the co-active veto, so
                                  # lowering this is safe for the on-screen case. Tune from
                                  # the same-cam reacquire histogram in the run summary.
                                  #
                                  # Lowered again 0.85 -> 0.70 from RTSPS run 20260729_162934
                                  # (3 cams, 90.6s, cuda:0). The SAME failure repeated one
                                  # notch down: attempts=22 ok=7 rejected_below_thr=15,
                                  # max_rejected 0.841 -- just under 0.85 again. Histogram
                                  # [<.5:1 .5-.6:1 .6-.7:2 .7-.8:8 .8-.9:4 .9+:6] puts the
                                  # LARGEST bin at .7-.8, which identity.threshold's
                                  # calibration note (~line 136) identifies as the genuine
                                  # same-person range (different people top out ~0.57).
                                  # 0.85 sat ABOVE the same-person cluster, so live minted
                                  # 25 ids for 7 real people (offline reconcile: 35 tracklets
                                  # -> 7 identities) and on-screen ids flipped on every turn
                                  # and crossing. 0.70 sits below the cluster and still well
                                  # clear of the ~0.57 different-people ceiling.
                                  #
                                  # Why this is stricter in effect than reconcile's 0.90:
                                  # reconcile scores tracklet PROTOTYPES averaged over many
                                  # observations (denoised, 0.905-0.995 in that run), while
                                  # this lane scores a partial live aggregate off noisy
                                  # single crops. Same 0-1 scale, different distributions --
                                  # the two numbers are NOT comparable.
    cross_camera_threshold: 0.60  # cross-camera lane: link the same person across cams.
                                  # Lowered 0.63 -> 0.60 from A100 run #2: 9 real
                                  # cross-camera matches landed just under 0.63
                                  # (max sub-threshold 0.628), while different-person
                                  # prototype cosine tops out ~0.55-0.57, so 0.60 keeps
                                  # a safe margin. Re-check the x-camera line + eyeball
                                  # outputs for false merges after changing.
    accept_margin: 0.03     # cross-camera runner-up margin (ported from identity.min_score_gap)
    bank_size: 20           # exemplar embeddings kept per live identity; scoring
                            # blends the bank MEAN (prototype) with the strongest
                            # single exemplar (medoid-style) -- ported from
                            # identity.bank_size / service.py::_bank_score
    split_contradiction_margin: 0.05
  # OFFLINE reconciliation for the LIVE path -- the "correct-answer-at-the-end"
  # flow. The live RTSP feed is NEVER recorded. During the run each camera's
  # PROCESSED (clean) frames + box geometry are captured to a transient temp clip
  # (._live_src_<cam>.mp4) and every FRESH ReID observation (embedding + bbox +
  # confidence + timestamp) is persisted to the store. On stop (Ctrl-C / sources
  # ended / max_duration) the SAME proven offline reconcile the file path uses
  # rebuilds cross-camera identities and re-renders output_<cam>.mp4 with the
  # CORRECT reids -- same person = same id/colour in every camera. The merge
  # thresholds are taken from identity.reconcile.* (0.63 / 0.90 / reciprocal-best)
  # so a live run and a file run reconcile IDENTICALLY. Set enabled: false to
  # restore the old immediate-on-Ctrl-C live-annotated output (paced WriterStage).
  reconcile:
    enabled: true
    sample_stride: 1        # store every Nth FRESH embedding per track. Fresh
                            # embeddings already arrive only every reid.interval
                            # frames (they are NOT per-frame), so this is a second,
                            # optional subsample on top of that. 1 = keep every
                            # fresh observation (matches the file-batch path).
    # #65: per-camera ceiling on the transient clip, in GB. 0 = unlimited, which
    # is what shipped -- clips grew at ~1.2-2.2 MB/s each with no cap, no rotation
    # and no free-space check, so four cameras fill ~21 GB/hour until the disk dies
    # and takes the run with it. Hitting the cap stops RECORDING for that camera;
    # the run's identities are unaffected, only the offline re-render is truncated.
    max_clip_gb: 4.0
    keep_frames: true       # keep the per-camera processed-frame clips after the
                            # final render, together with the
                            # ._live_src_<cam>.annotations.json box geometry the
                            # render stage writes beside each one.
                            #
                            # ON since 2026-07-30, and it should stay on while
                            # reconcile is being tuned. Clip + sidecar + the run's
                            # embeddings in Qdrant are a COMPLETE record of the run,
                            # so reconcile and the render can be replayed offline at
                            # any settings:
                            #   python tests/calibration/rerender_from_clips.py <run_id> --cross 0.70,0.75
                            # That turns "try another threshold" from a five-minute
                            # capture with people walking the room into a local job
                            # that produces watchable videos on the SAME footage and
                            # the SAME track ids -- the only way two settings can
                            # honestly be compared.
                            #
                            # COST: ~1.2-2.2 MB/s per camera (see plan #65), so a
                            # 5-minute 4-camera run keeps roughly 1.8 GB. Set false
                            # once tuning is done, or prune old ._live_src_* by hand.
  output:
    write_video: true
    video_path: output_<cam>.mp4
    codec: h264             # software x264; falls back to mp4v
    pacing: wallclock
    fps_default: 20
    resolution: native
    max_writer_queue: 16
    offline_overlay_after_sec: 3   # after this gap, write CAMERA OFFLINE frames
  metrics:
    log_interval_sec: 10
    report_peaks: true
  # Cross-camera physical-impossibility veto (src/live/topology.py; documented in
  # ARCHITECTURE.md section 8.2 and README section 10). FAIL-OPEN: when
  # disabled or with no edges, appearance alone decides every link, and any
  # camera NOT named below is never blocked. Camera names MUST match the runtime
  # names -- stream URLs are auto-named cam_<last-IP-octet> (see main.py
  # _camera_name_from_source), so the mapping is: camera1=cam_224, camera2=cam_219,
  # camera3=cam_213 (chokepoint), camera4=cam_206.
  topology:
    # Cross-camera physical-impossibility veto -- ENABLED with MEASURED transit
    # times (minimum seconds to physically move between adjacent cameras). During
    # cross-camera matching a candidate identity is PRUNED if less than the
    # shortest-path minimum has elapsed since it was last seen (a person can't
    # teleport): this both cuts cross-camera false-merges AND removes impossible
    # competitors so the reachable true match can win the runner-up margin.
    # Multi-hop pairs auto-sum along the shortest path through the cam_213
    # chokepoint (e.g. cam_206 <-> cam_224 = 3 + 2 = 5s). cam_224 & cam_219 are
    # co-visible (same room, overlapping views) -> 0: no time constraint (the
    # co-active veto handles co-presence). Undirected. Format: [a, b, min_sec].
    #
    # DISABLED after A100 testing: with these cameras the view-to-view handoff is
    # FASTER than the walking distance suggests (adjacent/overlapping fields of
    # view), so a 2-3s minimum pruned the TRUE cross-camera match (linked collapsed
    # 5 -> 1, topology_pruned=508). Min-transit vetoes only work when cameras are
    # far apart with a real gap between views; here they are not. Back to
    # appearance-only. (Set enabled: true only if you separate the cameras.)
    enabled: false
    edges:
      - [cam_224, cam_219, 0]   # same room, co-visible (overlapping views)
      - [cam_224, cam_213, 2]   # room -> chokepoint (measured)
      - [cam_219, cam_213, 2]   # room -> chokepoint (measured)
      - [cam_213, cam_206, 3]   # chokepoint <-> cam 4 (measured; only way in/out)
  limits:
    max_active_identities: 200  # LRU cap on the in-memory active set (bounds memory)
    active_ttl: 300         # SECONDS unseen before a live identity is evicted from
                            # the active set. NOTE: the live engine reasons in
                            # wall-clock seconds (frame.ts), not frames -- frames are
                            # per-camera and get dropped, so they aren't comparable
                            # across the pipeline. Keep this GENEROUSLY larger than a
                            # typical absence: an identity must survive a person's
                            # time off-screen for same-camera cold reactivation and
                            # cross-camera linking to reuse it rather than mint anew.
    queue_warn_pct: 80
    drop_warn_pct: 5
