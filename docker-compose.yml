services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: person-reid-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage


  reid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: person-reid-nvdcf
    depends_on:
      - qdrant
    network_mode: host
    gpus: all
    ipc: host
    shm_size: "8gb"
    privileged: true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video,graphics
      QDRANT_URL: "${QDRANT_URL:-http://127.0.0.1:6333}"
      NVDCF_DEEPSTREAM_ROOT: /opt/nvidia/deepstream/deepstream
      NVDCF_TRACKER_LIBRARY: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      NVDCF_TRACKER_CONFIG: /opt/reid/nvdcf_accuracy.yml
      GST_PLUGIN_PATH: /opt/nvidia/deepstream/deepstream/lib/gst-plugins
    volumes:
      - ./:/workspace/inference_person_reid
      - ~/.insightface:/root/.insightface
      - ~/.cache:/root/.cache
    working_dir: /workspace/inference_person_reid
    stdin_open: true
    tty: true


volumes:
  qdrant_data:
