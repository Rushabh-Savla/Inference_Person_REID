detector:
  model: weights/yolo11m.pt
  conf: 0.35
  iou: 0.60
  tracker: bytetrack.yaml

reid:
  model: nvidia_reidentificationnet
  weights: weights/reid/resnet50_market1501_aicity156.onnx
  device: cuda
  max_batch: 32
  interval: 5
  part_interval: 15
  illumination_variant: true
  min_quality: 0.20

cross_camera_models:
  swin_weights: weights/reid/nvidia_swin_base_1024/export_55/swin_base_market1501_aicity156_featuredim1024.onnx
  solider_weights: weights/solider_swin_base_msmt17.onnx
  swin_batch: 16
  solider_batch: 16

identity_v6:
  match_threshold: 0.60
  match_margin: 0.035
  strong_threshold: 0.72
  support_required: 2
  accumulated_body: 0.56
  accumulated_support: 3
  partial_threshold: 0.58
  partial_support: 2
  gallery: 32
  candidate_gallery: 12
  promote_quality: 0.68
  novelty: 0.985
  same_camera_gap_sec: 15.0
  same_camera_distance: 5.0
  same_camera_min_continuity: 0.35
  merge_body: 0.82
  merge_support: 3
  seed_count: 3

  # Cross-camera model agreement. These are deliberately conservative.
  final_cross_resnet_min: 0.55
  final_cross_swin_min: 0.55
  final_cross_solider_min: 0.50
  final_cross_fused_min: 0.69
  final_cross_strong: 0.72
  final_cross_margin: 0.045
  final_cross_conflict: 0.32
  final_cross_time_tolerance_sec: 12.0
  camera_time_offsets_sec: {}

  # Overall weighting. The 222<->224 pair is explicitly SOLIDER-heavy.
  final_w_resnet: 0.28
  final_w_swin: 0.34
  final_w_solider: 0.30
  final_w_colour: 0.05
  final_w_shape: 0.03

  final_pair_weights:
    cam_222-cam_224:
      resnet: 0.25
      swin: 0.32
      solider: 0.38
      colour: 0.03
      shape: 0.02

tracking:
  fragment_gap_sec: 2.0

input:
  videos: []
  output_dir: rebuild_outputs_final_multimodel
