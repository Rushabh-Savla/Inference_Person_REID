# Strict independent live ReID configuration.
# No imports, weights or runtime dependency on seif744/Inference_PersonReid.

detector:
  model: weights/yolo11m.pt
  conf: 0.55
  iou: 0.60
  tracker: bytetrack.yaml

models:
  device: cuda
  resnet_weights: weights/reid/resnet50_market1501_aicity156.onnx
  resnet_model: nvidia_reidentificationnet
  resnet_tap: post_relu
  resnet_batch: 32
  swin_weights: weights/reid/nvidia_swin_base_1024/export_55/swin_base_market1501_aicity156_featuredim1024.onnx
  swin_batch: 16
  solider_weights: weights/solider_swin_base_msmt17.onnx
  solider_batch: 16

capture:
  feature_interval: 5
  min_quality: 0.20
  overlap_iou: 0.05
  overlap_intersection: 0.20

tracking:
  fragment_gap_sec: 2.0

geometry:
  enabled: true
  calibration_path: calibration/floor_frame.json

identity:
  deep_threshold: 0.56
  same_deep_threshold: 0.52
  attribute_threshold: 0.42
  cross_attribute_threshold: 0.46
  match_margin: 0.035
  same_camera_gap_sec: 15.0
  cross_camera_max_gap_sec: 30.0
  bank_size: 64
  novelty: 0.985
  confirm_samples: 2
  switch_margin: 0.05
  verify_threshold: 0.50
  verify_attribute_threshold: 0.34
  verify_grace_samples: 3

output_dir: rebuild_outputs_live_independent
