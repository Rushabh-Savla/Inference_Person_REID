detector:
  backend: nvdcf
  model: weights/yolo11m.pt
  conf: 0.55
  iou: 0.85
  library: auto
  config: trackers/nvdcf_accuracy.yml
  width: 0
  height: 0
  pose:
    enabled: true
    model: yolo11n-pose.pt

reid:
  model: nvidia_reidentificationnet
  weights: weights/reid/resnet50_market1501_aicity156.onnx
  device: cuda
  max_batch: 32
  interval: 1
  part_interval: 1
  illumination_variant: true
  min_quality: 0.20

cross_camera_models:
  swin_weights: weights/reid/nvidia_swin_base_1024/export_55/swin_base_market1501_aicity156_featuredim1024.onnx
  solider_weights: weights/solider_swin_base_msmt17.onnx
  swin_batch: 16
  solider_batch: 16

identity_state:
  path: identity_state/reid_nvdcf_strict_v4.sqlite3
  model_id: nvdcf-strict-multimodal-v4
  bank_size: 96
  qdrant_path: qdrant_storage_nvdcf_strict_v3
  qdrant_prefix: person_reid_nvdcf_strict_v4
  qdrant_limit: 32
  qdrant_url: http://127.0.0.1:6333

identity:
  interval: 1
  recovery_frames: 20
  existing_min: 0.62
  margin: 0.015
  recovery_min: 0.62
  recovery_margin: 0.025
  new_floor: 0.50
  known_floor: 0.58
  new_confirm_frames: 5
  new_pending_match_min: 0.84
  new_pending_margin: 0.08
  new_pending_model_min: 0.55
  new_pending_clothing_min: 0.60
  new_pending_required_models: 3
  new_existing_guard: 0.58
  pending_ttl_seconds: 300
  pending_max: 64
  pending_time_gap: 0.75
  top_min: 0.52
  bottom_min: 0.52
  clothing_joint_min: 0.52
  model_min: 0.46
  deep_min: 0.48
  face_min: 0.60
  face_quality_min: 0.50
  dummy_floor: 0.35
  new_max: 0.48
  new_deep_max: 0.54
  memory_quality_min: 0.45
  memory_required_models: 2
  memory_model_min: 0.52
  memory_deep_min: 0.56
  memory_top_min: 0.50
  memory_bottom_min: 0.50
  memory_face_min: 0.68

face:
  enabled: true
  model: buffalo_l
  det_size: [640, 640]
  min_detection: 0.55
  min_size: 28
  min_quality: 0.50
  min_visibility: 0.68
  face_weight: 0.78
  min_similarity: 0.60

pose:
  enabled: true
  model: yolo11n-pose.pt

overlap:
  iou: 0.35
  intersection: 0.50

input:
  videos: []
  parallel_cameras: 3
  output_dir: rebuild_outputs_nvdcf_strict_v4
