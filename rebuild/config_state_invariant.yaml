detector:
  backend: nvdcf
  model: weights/yolo11m.pt
  conf: 0.55
  iou: 0.60
  library: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  config: /opt/nvidia/deepstream/deepstream/samples/configs/deepstream-app/config_tracker_NvDCF_accuracy.yml
  width: 0
  height: 0
  pose:
    enabled: true
    model: yolo11n-pose.pt

reid:
  model: nvidia_reidentificationnet
  weights: weights/reid/resnet50_market1501_aicity156.onnx
  device: cuda
  max_batch: 32
  interval: 2
  part_interval: 2
  illumination_variant: true
  min_quality: 0.20

cross_camera_models:
  swin_weights: weights/reid/nvidia_swin_base_1024/export_55/swin_base_market1501_aicity156_featuredim1024.onnx
  solider_weights: weights/solider_swin_base_msmt17.onnx
  swin_batch: 16
  solider_batch: 16

identity_state:
  path: identity_state/reid_nvdcf_multimodal_v1.sqlite3
  model_id: nvdcf-multimodal-v1
  bank_size: 96
  qdrant_path: qdrant_storage_nvdcf
  qdrant_prefix: person_reid_nvdcf
  qdrant_limit: 32

identity:
  interval: 2
  recovery_frames: 8
  existing_min: 0.68
  margin: 0.035
  recovery_min: 0.66
  recovery_margin: 0.05
  new_floor: 0.55

face:
  enabled: true
  required: true
  model: buffalo_l
  det_size: [640, 640]
  min_detection: 0.55
  min_size: 32
  min_quality: 0.50
  min_visibility: 0.68
  device: cuda

pose:
  enabled: true
  model: yolo11n-pose.pt

overlap:
  iou: 0.45
  intersection: 0.60

input:
  videos: []
  output_dir: rebuild_outputs_nvdcf
