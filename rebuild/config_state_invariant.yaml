detector:
  model: weights/yolo11m.pt
  conf: 0.35
  iou: 0.60
  tracker: bytetrack.yaml

reid:
  model: nvidia_reidentificationnet
  weights: weights/reid/resnet50_market1501_aicity156.onnx
  device: cuda
  max_batch: 32
  interval: 5
  part_interval: 10
  illumination_variant: true
  min_quality: 0.20

cross_camera_models:
  swin_weights: weights/reid/nvidia_swin_base_1024/export_55/swin_base_market1501_aicity156_featuredim1024.onnx
  solider_weights: weights/solider_swin_base_msmt17.onnx
  swin_batch: 16
  solider_batch: 16

identity_state:
  path: identity_state/reid_state_invariant_v3.sqlite3
  model_id: final-state-invariant-v3
  bank_size: 64

identity_v6:
  # V6 remains the local appearance evidence source; final identity decisions
  # are repaired by the state-invariant layer below.
  match_threshold: 0.60
  match_margin: 0.035
  strong_threshold: 0.72
  support_required: 2
  accumulated_body: 0.56
  accumulated_support: 3
  partial_threshold: 0.58
  partial_support: 2
  gallery: 32
  candidate_gallery: 12
  promote_quality: 0.68
  novelty: 0.985
  same_camera_gap_sec: 15.0
  same_camera_distance: 5.0
  same_camera_min_continuity: 0.35
  merge_body: 0.82
  merge_support: 3
  seed_count: 3

  # Final cross-camera state-invariant matcher.
  state_cross_fused_min: 0.58
  state_cross_partial_fused_min: 0.54
  state_cross_strong: 0.82
  state_cross_margin: 0.025
  state_cross_partial_margin: 0.020
  state_cross_resnet_min: 0.50
  state_cross_swin_min: 0.48
  state_cross_solider_min: 0.48
  state_cross_required_models: 2
  state_cross_required_mutual_models: 2
  state_cross_required_views: 2
  state_cross_max_gap_sec: 8.0

  # Same-camera fragmented-track repair. This happens before MTMC so a
  # fragmented person cannot remain permanently split just because the
  # protected V6 local solver minted separate local IDs.
  state_same_camera_gap_sec: 20.0
  state_same_camera_fused_min: 0.58
  state_same_camera_continuity_min: 0.32
  state_same_camera_strong: 0.72

  state_gallery_match_min: 0.66
  state_gallery_margin: 0.03
  camera_time_offsets_sec: {}

tracking:
  fragment_gap_sec: 2.0

input:
  videos: []
  output_dir: rebuild_outputs_state_invariant
