  device: auto
  det_size: [640, 640]
  interval: 15
  min_detection: 0.55
  min_size: 32
  min_quality: 0.42
  strong_quality: 0.64
  bank: 8

identity_v4:
  match_threshold: 0.61
  match_margin: 0.035
  strong_threshold: 0.74
  support: 2
  gallery: 24
  novelty: 0.985
  promote_quality: 0.70
  new_count: 3
  face_threshold: 0.70
  face_strong_threshold: 0.80
  face_margin: 0.06
  face_quality: 0.48
  face_strong_quality: 0.64
  body_conflict: 0.52

tracking:
  fragment_gap_sec: 2.0

input:
  videos: []
  output_dir: rebuild_outputs
