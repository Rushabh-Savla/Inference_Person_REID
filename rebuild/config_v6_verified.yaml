detector:
  model: weights/yolo11m.pt
  conf: 0.35
  iou: 0.60
  tracker: bytetrack.yaml

reid:
  model: nvidia_reidentificationnet
  weights: weights/reid/resnet50_market1501_aicity156.onnx
  device: cuda
  max_batch: 32
  interval: 5
  part_interval: 15
  illumination_variant: true
  min_quality: 0.20

identity_v6:
  # Original V6 identity parameters are preserved.
  match_threshold: 0.60
  match_margin: 0.035
  strong_threshold: 0.72
  support_required: 2
  accumulated_body: 0.56
  accumulated_support: 3
  partial_threshold: 0.58
  partial_support: 2
  gallery: 32
  candidate_gallery: 12
  promote_quality: 0.68
  novelty: 0.985
  same_camera_gap_sec: 15.0
  same_camera_distance: 5.0
  same_camera_min_continuity: 0.35
  merge_body: 0.82
  merge_support: 3
  seed_count: 3

  # Symmetric camera graph. ReID is primary; colour/time/shape are support only.
  cross_graph_reid_weight: 0.78
  cross_graph_color_weight: 0.12
  cross_graph_time_weight: 0.06
  cross_graph_shape_weight: 0.04
  cross_graph_min_reid: 0.50
  cross_graph_min_score: 0.58
  cross_graph_margin: 0.035
  cross_graph_color_gate: 0.62
  cross_graph_strong_reid: 0.68
  cross_graph_time_tolerance_sec: 8.0

  # Recording clocks; weak supporting evidence only.
  camera_time_offsets_sec:
    cam_213: 8.0
    cam_222: 0.0
    cam_224: 3.0

tracking:
  fragment_gap_sec: 2.0

input:
  videos: []
  output_dir: rebuild_outputs_verified
