detector:
  model: weights/yolo11m.pt
  conf: 0.35
  iou: 0.60
  tracker: bytetrack.yaml

reid:
  model: nvidia_reidentificationnet
  weights: weights/reid/resnet50_market1501_aicity156.onnx
  device: cuda
  max_batch: 32
  interval: 5
  part_interval: 15
  illumination_variant: true
  min_quality: 0.20

identity_v6:
  match_threshold: 0.60
  match_margin: 0.035
  strong_threshold: 0.72
  support_required: 2
  accumulated_body: 0.56
  accumulated_support: 3
  partial_threshold: 0.58
  partial_support: 2
  gallery: 32
  candidate_gallery: 12
  promote_quality: 0.68
  novelty: 0.985
  same_camera_gap_sec: 15.0
  same_camera_distance: 5.0
  same_camera_min_continuity: 0.35
  merge_body: 0.82
  merge_support: 3
  seed_count: 3

  cross_camera_tie_margin: 0.025
  cross_camera_consensus_bonus: 0.015
  cross_camera_consensus_bonus_strong: 0.028
  cross_camera_consensus_threshold: 0.64
  cross_camera_consensus_strong: 0.70
  cross_camera_geometry_bonus: 0.004
  cross_camera_geometry_min: 0.70

  cross_camera_temporal_enabled: true
  cross_camera_temporal_tolerance_sec: 6.0
  cross_camera_temporal_bonus: 0.045
  cross_camera_temporal_strong_bonus: 0.065
  cross_camera_temporal_threshold: 0.56
  cross_camera_temporal_strong: 0.66
  cross_camera_temporal_conflict_threshold: 0.45
  cross_camera_temporal_conflict_penalty: 0.050

  cross_camera_link_min_body: 0.50
  cross_camera_link_min_score: 0.53
  cross_camera_link_margin: 0.035
  cross_camera_link_bonus: 0.16
  cross_camera_link_strong_bonus: 0.22
  cross_camera_link_conflict_penalty: 0.18
  cross_camera_link_temporal_weight: 0.12
  cross_camera_link_geometry_weight: 0.06

  cross_camera_link_override_min: 0.56
  cross_camera_link_override_bonus: 0.28
  cross_camera_link_override_penalty: 0.28

  # Fixed-room geometry: these are normalized image coordinates for stable
  # seated positions visible in the supplied 222/224 recordings. Moving tracks
  # do not receive this evidence. Zone labels are semantic seat locations,
  # not person identities.
  room_zone_pair_weight: 0.22
  room_zone_conflict_penalty: 0.18
  room_zone_radius_norm: 0.11
  room_zone_stability_ratio: 1.20

  room_zone_anchors:
    cam_222:
      white: [0.293, 0.229]
      black: [0.391, 0.278]
      brown: [0.176, 0.556]
      patterned: [0.254, 0.590]
    cam_224:
      patterned: [0.215, 0.840]
      black: [0.430, 0.743]
      brown: [0.176, 0.972]
      white: [0.438, 0.993]

  room_zone_maps:
    cam_222:
      cam_224:
        white: white
        black: black
        brown: brown
        patterned: patterned

  camera_time_offsets_sec:
    cam_213: 8.0
    cam_222: 0.0
    cam_224: 3.0

  camera_processing_priority:
    cam_222: 0
    cam_213: 1
    cam_224: 2

tracking:
  fragment_gap_sec: 2.0

input:
  videos: []
  output_dir: rebuild_outputs_verified
